<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <!-- The note editor of the iPhone app talks to nobody: no fetch, no socket, no worker. Pictures only from the
         app's own scheme (nextasks-file://<attachment id>) or data:, never from another address. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src nextasks-file: data:; font-src 'self' file: data:; connect-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>nextasks note</title>
  </head>
  <body>
    <div id="note"></div>
    <script type="module" src="/src/noteapp/main.ts"></script>
  </body>
</html>
