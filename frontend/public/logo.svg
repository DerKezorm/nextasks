<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The mark: a white tile when the system is light, a dark one when it is dark (source nexapps/icons-vergleich/neu.py). -->
  <style>
    .grund { fill: #fff }
    .rand { stroke: #38a9c4; stroke-opacity: .35 }
    .haken { stroke: #1f8fab }
    .v1 { stop-color: #7fd0e3 } .v2 { stop-color: #38a9c4 } .v3 { stop-color: #0b5c70 }
    @media (prefers-color-scheme: dark) {
      .grund { fill: #0b1619 }
      .rand { stroke: #56c3dc; stroke-opacity: .45 }
      .haken { stroke: #7fd6ea }
      .v1 { stop-color: #c9f0f8 } .v2 { stop-color: #56c3dc } .v3 { stop-color: #1f8fab }
    }
  </style>
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="10" y1="10" x2="54" y2="54">
      <stop offset="0" class="v1"/>
      <stop offset=".5" class="v2"/>
      <stop offset="1" class="v3"/>
    </linearGradient>
  </defs>
  <rect class="grund" x="2" y="2" width="60" height="60" rx="16"/>
  <rect class="rand" x="2.75" y="2.75" width="58.5" height="58.5" rx="15.3" fill="none" stroke-width="1.5"/>
  <rect x="16" y="16" width="32" height="32" rx="7" fill="none" stroke="url(#g)" stroke-width="4.5"/>
  <path class="haken" d="M23 32.5l6.5 6.5L42 25" fill="none" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
