[tool.ruff]
target-version = "py313"
line-length = 120
# The shared modules (sign-in, accounts, mail, log, backup, keys) and their contract tests come unchanged from bauplaene and are
# linted there; the references for repeating, the merge rule, order keys and push come unchanged from
# nextasks-ios/docs/pruefsaetze.
extend-exclude = ["app/vendor/nexoidc", "tests/nexoidc", "app/vendor/nexlog", "tests/nexlog", "app/vendor/nexkonten",
                  "app/vendor/nexpost",
                  "app/vendor/nexsicherung", "tests/nexsicherung", "app/vendor/nexschluessel", "tests/nexschluessel",
                  "app/services/wiederholung.py", "app/services/gleichstand.py", "app/services/position.py",
                  "app/services/push_crypto.py"]

[tool.ruff.lint]
extend-select = ["E501", "E402", "S608", "B", "I"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.File",
    "fastapi.Form",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
